name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: YAML files parse
        # A colon in a step name once made this whole file invalid, so GitHub created no
        # job at all and the failure looked like a quiet success. It is asserted now.
        run: |
          python3 -m pip install --quiet pyyaml
          # Every workflow, not just this one: a broken publish.yml is discovered at release time
          # otherwise, which is the worst moment to discover it.
          python3 -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml') + ['action.yml', '.github/dependabot.yml', 'examples/github-actions/policy.yml']]; print('yaml ok')"
      - name: Unit tests
        run: npm test   # includes test/*.test.mjs, which runs the built page against a DOM stub
      - name: M1 acceptance (the service answers what it claims to)
        run: node scripts/acceptance.mjs
      - name: M2 acceptance (policy fail, pass and incomplete)
        run: node scripts/acceptance-m2.mjs
      - name: M3 acceptance (SARIF, exit codes, and the silent-change diff)
        run: node scripts/acceptance-m3.mjs
      - name: M4 acceptance (the gateway refuses, filters and logs)
        run: node scripts/acceptance-m4.mjs
      - name: M5 acceptance (backup, restore, and a truncated archive that must fail)
        run: node scripts/acceptance-m5.mjs
      - name: Scale check (20k records; fails if a lookup exceeds 10 ms p50)
        run: node scripts/bench.mjs 20000 100
      - name: Corpus regression (benign silent, positives fire)
        run: node packages/guard/scripts/regression.mjs
      - name: No third-party dependencies, asserted rather than assumed
        run: node scripts/check-zero-deps.mjs
      - name: Our own SBOM generates and parses
        run: |
          node scripts/sbom.mjs --out /tmp/agentgate.cdx.json
          node -e "JSON.parse(require('node:fs').readFileSync('/tmp/agentgate.cdx.json','utf8')); console.log('sbom ok')"
      - name: Deploy rehearsal (everything except systemd and Caddy)
        run: node scripts/rehearse-deploy.mjs
      - name: Self-scan (minus the intentional bad examples)
        run: node packages/guard/bin/agent-guard.mjs . --exclude packages/guard/corpus,node_modules --fail-on high
      - name: An incomplete scan exits 2 no matter what --fail-on says
        run: node -e "import('./packages/guard/test/invariant.mjs')"

  docker:
    # The compose path had never been run anywhere: there is no docker on the laptop or on the
    # deployment server, so its only evidence was a test that read the YAML. Zero runtime
    # dependencies make the image a copy of the repository, so building it here and asking it
    # for health is cheap. The mount brings the sample index, hence the lower --expect-min.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the image and serve from it
        run: |
          docker compose up -d --build agentgate
          node scripts/smoke.mjs http://127.0.0.1:8080 --expect-min 300 --allow-stale
      - name: The container's own log, when something above failed
        if: failure()
        run: docker compose logs --no-log-prefix agentgate
      - name: Tear down
        if: always()
        run: docker compose down -v

  minimum-node:
    # package.json says node >= 20 and the deployment target runs 20.20.2, while the job above
    # tracks 24. This job keeps the floor a fact instead of a claim, the way the source scan
    # keeps the corpus honest: a version nobody runs is not a supported version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests on the oldest supported node
        run: npm test
      - name: Deploy rehearsal on the oldest supported node
        run: node scripts/rehearse-deploy.mjs
