name: pages

# Publish the evidence index as a browsable page, and mirror the deployment's capture ledger
# somewhere other than the deployment. This job used to make its own snapshots here and force-push
# a single-commit history branch: a record that can be replaced at will, and which could hold the
# committed sample when the refresh failed. It now copies the chain the deployment actually wrote
# (GET /v1/history) and appends it to the branch with normal commits, so the copy on GitHub is a
# second location that cannot be rewritten retroactively without contradicting a commit.
on:
  push:
    branches: [main]
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Refresh from the live registry
        run: |
          node bin/agentgate.mjs refresh --max 300 && echo "refreshed" || echo "refresh failed; falling back to the committed sample"
      - name: Mirror the deployment's capture ledger
        run: |
          mkdir -p data/history
          BASE=https://app.xn--5kvo87g.com
          if curl -fsS --max-time 60 "$BASE/v1/history" -o data/history/ledger.jsonl; then
            echo "mirrored $(wc -l < data/history/ledger.jsonl) capture(s)"
            node bin/agentgate.mjs history --history data/history || echo "the mirrored ledger did not verify"
          else
            echo "the deployment did not serve a ledger; nothing is mirrored"
            rm -f data/history/ledger.jsonl
          fi
          if curl -fsS --max-time 60 "$BASE/v1/history/diff" -o data/diff.md; then
            echo "diff: $(head -c 60 data/diff.md)"
          else
            echo "no diff was served; the page will be built without one"
            rm -f data/diff.md
          fi
      - name: Build the browsable index
        run: |
          INDEX=data/index.json
          test -s "$INDEX" || INDEX=data/sample-index.json
          echo "building from $INDEX"
          node scripts/build-site.mjs --index "$INDEX" --out dist --diff data/diff.md --history data/history
      - name: Keep the mirrored record on the history branch
        run: |
          test -s data/history/ledger.jsonl || { echo "no ledger to record"; exit 0; }
          WORK=$(mktemp -d)
          cd "$WORK"
          git init -q -b history
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # A full fetch, not --depth 1: GitHub refuses a push from a shallow repository, and this
          # step failing quietly meant the record was not mirrored at all.
          if git fetch -q origin history 2>/dev/null; then
            git reset -q --hard FETCH_HEAD
            # The old scheme wrote whole 2.4 MB indexes into this branch. Their hashes are in the
            # ledger now, so the branch keeps the record and the diffs, not the bulk.
            git rm -q -f previous.json 2>/dev/null || true
            git rm -q -f 20??-??-??.json 2>/dev/null || true
          fi
          # Source paths are absolute: this directory is a fresh empty repo, and copying a file
          # onto itself is not a merge. The first version of this step did exactly that.
          cp "$GITHUB_WORKSPACE/data/history/ledger.jsonl" ledger.jsonl
          if [ -f "$GITHUB_WORKSPACE/data/diff.md" ]; then cp "$GITHUB_WORKSPACE/data/diff.md" "diff-$(date -u +%F).md"; fi
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          if git -c user.name="github-actions" -c user.email="actions@github.com" diff --cached --quiet; then
            echo "the mirrored record is unchanged"
            exit 0
          fi
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "ledger $(date -u +%F)"
          git push -q origin history || echo "history push failed; the page is still correct"
      - name: A sample report, from the project that breaks its own policy
        run: |
          node bin/agentgate.mjs check --root examples/action-verify --policy examples/action-verify/agentgate.policy.json --format html --out dist/report-sample.html || echo "expected: the sample is meant to fail the check"
          test -s dist/report-sample.html || echo "no sample report was written"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
