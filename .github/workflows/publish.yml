# Trusted Publishing: npm is told which repository and which workflow may publish, and
# GitHub proves it with an OIDC token. There is no npm token in this repository to steal,
# and the published tarball carries a provenance attestation naming this commit.
#
# One-time setup on npmjs.com: package -> Settings -> Trusted Publisher -> GitHub Actions,
# repository ciceroyang/agentgate, workflow publish.yml.
name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # contents: write is for attaching the SBOM to the release, not for the publish itself.
  contents: write
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          # Trusted Publishing exchanges the OIDC token for a short-lived publish token;
          # the registry has to be named for that exchange, and no secret is stored here.
          registry-url: "https://registry.npmjs.org"
      - name: Refuse to publish if the tests fail
        run: npm test
      - name: Refuse to publish invalid release contents
        run: node scripts/release-check.mjs --tag "$GITHUB_REF_NAME"
      - name: Refuse to publish a tag that does not match the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version" || { echo "tag $tag does not match version $version"; exit 1; }
      - name: Generate our own SBOM before publishing
        run: node scripts/sbom.mjs --out sbom/agentgate.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
      # Trusted publishing only happens when npm has no token at all. setup-node writes an
      # _authToken line into .npmrc for the registry it is given, so the file is removed for this
      # step and npm falls through to the OIDC exchange. Older setup-node versions also exported
      # a placeholder NODE_AUTH_TOKEN, which npm 11 preferred over OIDC; the registry answered
      # "404 Not Found - PUT", which reads like a permissions problem and is not one. This covers
      # both behaviours, and the version line makes the toolchain visible in the log.
      - name: Publish to the next tag first
        run: |
          rm -f "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          node -v && npm -v
          npm publish --provenance --access public --tag next
      - name: Attach the SBOM to the release when there is one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" sbom/agentgate.cdx.json --clobber
          else
            echo "no GitHub release for $GITHUB_REF_NAME; the SBOM is on this workflow run"
          fi
      - name: How to promote
        run: |
          echo "Published as next. Once the deployment demo is verified, promote with:"
          echo "  npm dist-tag add $(node -p "require('./package.json').name")@$(node -p "require('./package.json').version") latest"
